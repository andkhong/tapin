[project]
name = "tapin"
version = "0.1.0"
description = "Hand off in-progress work between AI coding agents when one hits its rate limit"
readme = "README.md"
authors = [{ name = "andkhong" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/andkhong/tapin"
Repository = "https://github.com/andkhong/tapin"
Issues = "https://github.com/andkhong/tapin/issues"

[project.scripts]
tapin = "tapin.cli:main"

[dependency-groups]
dev = ["pytest>=8", "mcp>=2.2,<3"]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
