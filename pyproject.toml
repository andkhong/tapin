[project]
name = "tapin"
version = "0.1.0"
description = "Hand off in-progress work between AI coding agents when one hits its rate limit"
requires-python = ">=3.13"
dependencies = ["mcp>=2.2,<3"]

[project.scripts]
tapin = "tapin.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
